skill = "bmad-lifecycle-email-sprint"

[[agent.menu]]
code = "RES"
description = "Run RevOps enablement sprint"
skill = "bmad-revops-enablement-sprint"

[[agent.menu]]
code = "MNS"
description = "Run monetization sprint"
skill = "bmad-monetization-sprint"

[[agent.menu]]
