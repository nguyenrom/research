description = "Save session insights to memory sidecar"
prompt = "Ensure the directory {project-root}/_bmad/_memory/marketing-orchestrator-sidecar/ exists (create it if missing) and that memories.md exists (initialize with a top-level heading if missing). Then append the key strategic insights from this session to {project-root}/_bmad/_memory/marketing-orchestrator-sidecar/memories.md, organized under a dated heading."
